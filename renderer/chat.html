<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; img-src 'self' app: data: https://kiriyuki.com; style-src 'self' 'unsafe-inline'; script-src 'self' app:">
<title>和大肥鱼聊天</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="chat">
  <header>
    <img src="../assets/pet/tray@2x.png" alt="">
    <div class="who">
      <div class="name">大肥鱼 <span id="outfitTag" style="font-weight:400;font-size:11px;color:var(--muted)">（今天 cos Claude）</span></div>
      <div class="status" id="status">在你桌面上待着</div>
    </div>
    <button class="ghost" id="clear" title="清空聊天记录">清空</button>
    <button class="ghost" id="settings" title="AI 设置">设置</button>
  </header>
  <div class="log" id="log"></div>
  <div class="composer">
    <button class="ghost" id="shot" title="给她看你的屏幕">看屏幕</button>
    <button class="ghost" id="mic" title="语音输入：按一下开始说，再按一下结束">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V5.5a3.5 3.5 0 1 0-7 0V11a3.5 3.5 0 0 0 3.5 3.5Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V19H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.09A6 6 0 0 0 18 11Z"/></svg>
      <span id="micTime"></span>
    </button>
    <textarea id="input" placeholder="和她说点什么…（Enter 发送，输入「余额」查 API 余额）"></textarea>
    <button class="primary" id="send">发送</button>
  </div>
</div>
<script src="mic.js"></script>
<script src="chat.js"></script>
</body>
</html>
